services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: video_chat
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  signaling:
    build:
      context: ./services/signaling
    command: npm start
    environment:
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
